<script>


params = new URLSearchParams(document.location.search);

      async function loadinfo() {
        
var gethash = getFileContents(('hash/' + params.get('id') + '.txt'), 'files', 'JBMConGithub'); hash = await gethash;

document.getElementById("frame").src = 'https://warp.mistium.com/editor.html?project_url=https://jbmcongithub.github.io/files/projectloader.sb3&hash=' + hash;


}

setTimeout(function(){
    loadinfo();
}, 100);
      
      
      
      async function clipFile() {
      
      var returnfile = getFileContents('projects/' + params.get('id') + '.txt', 'files', 'JBMConGithub'); thefile = await returnfile;
      navigator.clipboard.writeText(thefile)
      
      // failsafe for large files
      if (thefile == '') {
        
       var returnfile = returnProject('https://jbmcongithub.github.io/files/projects/' + params.get('id') + '.txt'); thefile = await returnfile;
       navigator.clipboard.writeText(thefile)
        
      }
      
      }
      
      
</script>

<div id="waiter" style="color: white; font-family: norms; text-align: center; display: none; justify-content: center; align-items: center; font-size: 30px; background-color: rgba(0, 0, 0, 0.6); width: 100%; height: 100%; position: absolute; top: 0px; left: 0px;" onclick="clipFile(); document.getElementById('waiter').style.display = 'none'">Click to load project</div>
